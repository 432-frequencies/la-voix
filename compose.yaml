services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: lavoix
      POSTGRES_DB: lavoix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U lavoix -d lavoix"]
      interval: 3s
      timeout: 3s
      retries: 20
  mail:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:8025:8025"
  migrate:
    build: .
    command: [npm, run, db:migrate]
    environment: &app-env
      DATABASE_URL: postgresql://lavoix:${POSTGRES_PASSWORD}@db:5432/lavoix
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Define BETTER_AUTH_SECRET in .env}
      APP_URL: http://localhost:8080
      NODE_ENV: development
      SMTP_HOST: mail
      SMTP_PORT: 1025
      MAIL_FROM: LA VOIX <noreply@example.test>
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8080:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mail:
        condition: service_started
volumes:
  postgres-data:
