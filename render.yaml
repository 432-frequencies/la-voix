# Render Blueprint: one free web service and one free PostgreSQL database.
# The database expires 30 days after creation. Do not use for durable production data.
services:
  - type: web
    name: la-voix
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run db:migrate && npm run db:seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: HOST
        value: 0.0.0.0
      - key: APP_URL
        fromService:
          type: web
          name: la-voix
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        fromDatabase:
          name: la-voix-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
databases:
  - name: la-voix-db
    plan: free
    region: frankfurt
    databaseName: lavoix
